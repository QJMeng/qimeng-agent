<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Qimeng Agent</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#20252d;font:16px system-ui}main{max-width:880px;margin:auto;padding:32px 20px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:26px;margin:0}small,#cwd{color:#667085}#cwd{font-size:13px;overflow-wrap:anywhere;margin:12px 0 24px}#chat{min-height:45vh}.card{background:white;border:1px solid #e1e5eb;border-radius:14px;padding:18px;margin:14px 0;white-space:pre-wrap;overflow-wrap:anywhere}.user{background:#eaf1ff;margin-left:12%}.label{font-size:12px;color:#667085;margin-bottom:8px;font-weight:700}.command{border-left:4px solid #d8a43b}.usage{font-size:12px;color:#667085;margin:8px 4px}.error{color:#b42318}button{border:0;border-radius:8px;padding:10px 16px;cursor:pointer;background:#244fd4;color:white;font:inherit}button:disabled{opacity:.5;cursor:default}.deny{background:#e9edf3;color:#303744;margin-left:8px}form{position:sticky;bottom:0;background:#f5f6f8;padding:16px 0;display:flex;gap:12px}textarea{flex:1;resize:vertical;min-height:68px;border:1px solid #ccd3dd;border-radius:12px;padding:14px;font:inherit}#status{font-size:13px;color:#667085}
</style>
<main><header><h1>Qimeng Agent</h1><small>Local research assistant</small></header><div id="cwd"></div><div id="chat"><div class="card" id="welcome">Ask a question or request a command. Shell commands and tools outside the allow list need your approval.</div></div><div id="status">Ready</div><form id="form"><textarea id="message" placeholder="Type a message..." required></textarea><button id="send">Send</button></form></main>
<script>
const token='__TOKEN__';let seen=0,busy=false,polling=false;
const chat=document.querySelector('#chat'),send=document.querySelector('#send'),status=document.querySelector('#status');
async function api(path,data){const r=await fetch(path,{method:data?'POST':'GET',headers:{'X-Token':token,'Content-Type':'application/json'},body:data?JSON.stringify(data):undefined});const value=await r.json();if(!r.ok)throw Error(value.error);return value}
function card(label,text,cls=''){document.querySelector('#welcome')?.remove();const box=document.createElement('div');box.className='card '+cls;const title=document.createElement('div');title.className='label';title.textContent=label;const content=document.createElement('div');content.textContent=text;box.append(title,content);chat.append(box);return box}
function render(e){if(e.kind==='user'||e.kind==='assistant'||e.kind==='error')card(e.kind==='user'?'You':e.kind==='assistant'?'Agent':'Error',e.text,e.kind);if(e.kind==='command'){const box=card('Tool awaiting approval',e.command,'command');box.dataset.call=e.id;for(const [label,approve] of [['Approve',true],['Deny',false]]){const b=document.createElement('button');b.textContent=label;b.className=approve?'':'deny';b.onclick=async()=>{try{await api('/approve',{id:e.id,approve});box.querySelectorAll('button').forEach(x=>x.disabled=true);status.textContent=approve?'Running command...':'Command denied';}catch(err){status.textContent=err.message}};box.append(b)}}if(e.kind==='result'){document.querySelectorAll('[data-call]').forEach(box=>{if(box.dataset.call===e.id)box.querySelectorAll('button').forEach(b=>b.disabled=true)});card('Tool result',e.text)}if(e.kind==='usage'){const u=e.usage;const el=document.createElement('div');el.className='usage';el.textContent=`Tokens: input ${u.prompt_tokens??'N/A'} | cached ${u.prompt_tokens_details?.cached_tokens??'N/A'} | output ${u.completion_tokens??'N/A'}`;chat.append(el)}}
async function poll(){if(polling)return;polling=true;try{const s=await api('/events');document.querySelector('#cwd').textContent='Working directory: '+s.cwd;for(const e of s.events.slice(seen))render(e);seen=s.events.length;busy=s.busy;send.disabled=busy;status.textContent=busy?'Working / waiting for command approval...':'Ready'}catch(err){status.textContent='Connection error: '+err.message}finally{polling=false}}
document.querySelector('#form').onsubmit=async e=>{e.preventDefault();if(busy)return;const input=document.querySelector('#message');try{send.disabled=true;await api('/chat',{message:input.value});input.value='';await poll()}catch(err){status.textContent=err.message;send.disabled=false}};
setInterval(poll,700);poll();
</script></html>
